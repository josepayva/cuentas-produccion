<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cuentas</title>
<meta name="apple-mobile-web-app-title" content="Cuentas">
<meta name="application-name" content="Cuentas">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Cuentas">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#051229">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
/* VOICE: herramienta de trabajo, directa, como una planilla de producción bien llevada.
   IDEA: la claqueta de rodaje: franja diagonal blanco/negro y la luz roja de REC para lo vencido.
   PICTURE: la banda negra con el monto "Por cobrar" enorme es el centro; debajo, la lista para cobrar.
   COLOUR and TYPE: blanco, negro, rojo REC #e4002b, un gris. Archivo ancho 800 para cifras, Archivo para texto.
   LAYOUT: móvil primero con barra inferior; en Mac, pestañas arriba y dos columnas. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0e0e0e);--ink:light-dark(#0b0b0b,#f2f2f2);--mute:light-dark(#666,#9c9c9c);
--line:light-dark(#e5e5e5,#2a2a2a);--soft:light-dark(#f5f5f5,#171717);--red:light-dark(#e4002b,#ff4466);
--band:light-dark(#0b0b0b,#1a1a1a);--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,-apple-system,sans-serif;overflow-x:clip;padding-bottom:calc(150px + var(--sb));-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
.wrap{max-width:1120px;margin:0 auto;padding:0 max(5vw,16px)}
.num,b,.big,dd{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;line-height:1.1}
button{font:inherit;color:inherit}
/* header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:var(--st)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-stretch:112%;font-size:19px;letter-spacing:-.01em;margin-right:auto;white-space:nowrap}
.brand svg{width:26px;height:26px}
.sync{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink);display:inline-block}
.sync.local i{background:var(--red)}
.ico{width:44px;height:44px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.ico svg,.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--bg);border-top:1px solid var(--line);padding-bottom:var(--sb)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;color:var(--mute);text-decoration:none;font-size:12px;font-weight:600}
.tabs a.on{color:var(--ink)}
.tabs a.on svg{stroke-width:2.4}
.fab{position:fixed;right:16px;bottom:calc(76px + var(--sb));z-index:25;min-height:52px;padding:0 20px;border-radius:26px;border:0;background:var(--red);color:#fff;font-weight:700;font-size:16px;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer}
@media(min-width:760px){
 body{padding-bottom:110px}
 .tabs{position:static;display:flex;gap:4px;border:0;padding:0;background:none;margin-right:8px}
 .tabs a{flex-direction:row;gap:8px;padding:10px 14px;border-radius:10px;font-size:15px}
 .tabs a.on{background:var(--soft)}
 .tabs svg{width:18px;height:18px}
 .fab{bottom:28px;right:28px}
}
.aviso{background:#c8002a;color:#fff;padding:10px max(5vw,16px);font-size:14px}
/* hero: la claqueta */
.hero{background:var(--band);color:#fff}
.hero::before{content:"";display:block;height:14px;background:repeating-linear-gradient(-45deg,#fff 0 14px,#0b0b0b 14px 28px)}
.hero .wrap{padding-top:26px;padding-bottom:28px}
.hero .lbl{color:rgba(255,255,255,.72)}
.lbl{font-size:13px;color:var(--mute);display:block}
.big{font-weight:800;font-stretch:112%;line-height:1;letter-spacing:-.02em;white-space:nowrap;margin:6px 0 4px}
.otras{font-size:16px;color:rgba(255,255,255,.8);font-weight:600}
.sub{font-size:15px;color:rgba(255,255,255,.75);margin:6px 0 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 24px;margin-top:22px;padding-top:16px;border-top:2px solid rgba(255,255,255,.22)}
.kpis b{display:block;font-size:clamp(19px,4.6vw,26px);font-weight:800;font-stretch:108%;white-space:nowrap}
.kpis small{color:rgba(255,255,255,.6);font-size:13px}
.kpis .rec{color:#ff5470}
/* secciones */
.sec{padding-top:26px;padding-bottom:26px}
.cols{display:grid;gap:8px 48px}
@media(min-width:900px){.cols{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-top:3px solid var(--ink);padding-top:10px;margin-bottom:4px}
.sh h2{font-size:20px;font-weight:800;font-stretch:108%}
.sh span{color:var(--mute);font-size:14px}
.ttl{font-size:clamp(30px,6vw,44px);font-weight:800;font-stretch:112%;letter-spacing:-.02em;margin:26px 0 14px;text-wrap:balance}
/* filas */
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row h3{font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row p{margin:2px 0 0;font-size:14px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ra{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.ra b{font-size:17px;font-weight:800;font-stretch:106%;white-space:nowrap}
.rq{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.row:hover h3{text-decoration:underline;text-underline-offset:3px}
.st{font-size:13px;color:var(--mute);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.st.vencido{color:var(--red);font-weight:700}
.st.vencido::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red)}
.st.pagado{color:var(--ink);font-weight:600}
.st.cotizado,.st.cancelado{border:1px solid var(--line);padding:1px 8px;border-radius:20px}
.bar{height:5px;background:var(--line);margin-top:9px;max-width:300px;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.bar.vencido i{background:var(--red)}
.bar.lg{height:8px;max-width:none;margin:12px 0 4px}
.mini{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.mini b{font-weight:800;white-space:nowrap}
.mini p{margin:2px 0 0;font-size:14px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini span{font-size:13px;color:var(--mute);text-align:right;white-space:nowrap}
.vacio{padding:28px 0;max-width:520px}
.vacio h3{font-size:22px;font-weight:800;font-stretch:108%;margin-bottom:8px}
.vacio p{color:var(--mute);margin:0 0 16px}
/* controles */
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-weight:650;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.red{border-color:var(--red);color:var(--red)}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
.btn.conf,.x.conf{background:var(--red);border-color:var(--red);color:#fff}
.btn:focus-visible,.ico:focus-visible,.chip:focus-visible,.x:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.bar-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.search{flex:1 1 240px;min-height:46px;font:inherit;font-size:16px;padding:0 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--bg);font-size:14px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
/* hoja / modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.ov[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px max(4vw,18px) calc(26px + var(--sb));overscroll-behavior:contain}
@media(min-width:760px){.ov{align-items:center;padding:20px}.sheet{border-radius:16px;max-height:88vh;padding:26px 30px}}
.shd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.shd h2{font-size:clamp(24px,5vw,32px);font-weight:800;font-stretch:110%;letter-spacing:-.01em;text-wrap:balance}
.eyebrow{margin:0 0 4px;font-size:14px;color:var(--mute)}
.x{flex:none;width:40px;height:40px;border-radius:20px;border:0;background:var(--soft);font-size:22px;line-height:1;cursor:pointer}
.x.sm{width:auto;min-width:34px;height:34px;padding:0 10px;font-size:14px}
.saldo{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-top:14px}
.saldo .lbl{width:100%}
.saldo b{font-size:clamp(34px,9vw,48px);font-weight:800;font-stretch:112%;letter-spacing:-.02em;white-space:nowrap}
.red{color:var(--red)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px 18px;margin:16px 0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kv dt{font-size:13px;color:var(--mute)}.kv dd{margin:0;font-weight:700;white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.acts.end{border-top:1px solid var(--line);padding-top:16px;margin-top:22px}
.sheet h4{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:800;margin:22px 0 4px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.sheet h4 span{color:var(--mute);font-weight:600;font-size:14px}
.lnk{border:0;background:none;color:var(--red);font-weight:700;font-size:14px;cursor:pointer;min-height:36px;padding:0 4px}
.it{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.it div{flex:1}.it b{white-space:nowrap}.it p{margin:0;font-size:13px;color:var(--mute)}
.gan{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:10px 0 0;font-size:15px}.gan span{flex:1}.gan b{flex:none;white-space:nowrap}
.nota{white-space:pre-wrap;color:var(--mute);margin:8px 0}
.hint{font-size:14px;color:var(--mute);margin:8px 0}
form label{display:block;font-size:14px;font-weight:650;margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;font-size:16px;min-height:46px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus,.search:focus{outline:2px solid var(--ink);outline-offset:0;border-color:var(--ink)}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 12px}
.req{color:var(--red)}
.cp{min-height:220px;font-size:14px;margin-top:10px}
.err{color:var(--red);font-size:14px;margin:10px 0 0;min-height:1em}
/* reportes */
.rtools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.rtools select{width:auto;min-width:120px}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:18px 28px;padding:16px 0 26px}
.figs div{border-top:3px solid var(--ink);padding-top:8px}
.figs b{display:block;font-size:clamp(22px,5vw,30px);font-weight:800;font-stretch:110%;white-space:nowrap}
.figs small{color:var(--mute);font-size:13px}
.hb{display:grid;grid-template-columns:minmax(64px,9em) minmax(0,1fr) auto;align-items:center;gap:10px;padding:7px 0;font-size:14px}
.hb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb div{height:16px;background:var(--soft);border-radius:2px;overflow:hidden}
.hb i{display:block;height:100%;background:var(--ink)}
.hb.r i{background:var(--red)}
.hb b{white-space:nowrap;text-align:right;font-weight:700}
.rgrid{display:grid;gap:10px 48px}
@media(min-width:900px){.rgrid{grid-template-columns:1fr 1fr}}
.grp{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--mute);margin:18px 0 0;text-transform:none}
.grp span{background:var(--soft);border-radius:10px;padding:0 7px;font-size:12px}
.grp.vencido{color:var(--red)}
.of{font-size:12px;color:var(--mute);white-space:nowrap}
.st.adelanto{color:var(--ink);font-weight:700}
.st.adelanto::before{content:"";width:6px;height:6px;border-radius:50%;border:2px solid var(--red)}
.st.porcobrar{color:var(--ink);font-weight:700}
.bar.adelanto i{background:var(--mute)}
.ahora{margin:8px 0 0;font-size:15px}
.seg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg label{margin:0;cursor:pointer;position:relative}
.seg input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.seg span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:46px;padding:6px 10px;font-weight:650;font-size:14px;line-height:1.2}
.seg input:checked+span{background:var(--ink);color:var(--bg)}
.seg input:focus-visible+span{outline:2px solid var(--red);outline-offset:-2px}
.presets{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 4px;font-size:14px;color:var(--mute)}
.cuota{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.2fr) 36px;gap:0 8px;align-items:end}
.cuota .x{margin-bottom:6px}
@media(max-width:520px){.cuota{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 36px}.cuota .cq1{grid-column:1/-1}}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cats label{margin:0;position:relative}
.cats input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.cats span{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border:1.5px solid var(--line);border-radius:20px;font-size:14px;font-weight:600;cursor:pointer}
.cats input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cats input:focus-visible+span{outline:2px solid var(--red)}
.chk{display:flex;align-items:center;gap:10px;font-weight:600;margin:14px 0 0;cursor:pointer}
.chk input,.inl input{width:22px;height:22px;min-height:0;accent-color:var(--ink);flex:none}
.inl{display:inline-flex;align-items:center;gap:6px;margin:0;font-size:14px;font-weight:600}
.cat{font-size:12px;font-weight:700;color:var(--mute);margin-left:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0}
.tag{font-size:12px;font-weight:650;border:1px solid var(--line);border-radius:20px;padding:1px 9px;white-space:nowrap;color:var(--ink)}
.tag.warn{border-color:var(--red);color:var(--red)}
.gi{cursor:pointer}.gi:hover b{text-decoration:underline}
.pv{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 18px;font-size:14px;margin-top:14px;padding:12px 0;border-top:1px solid var(--line)}
.pv span:nth-child(3n+2),.pv span:nth-child(3n){text-align:right;white-space:nowrap}
.pv2{grid-template-columns:minmax(0,1fr) auto}.pv2 span:nth-child(2n){text-align:right;white-space:nowrap}.pv2 span:nth-child(3n),.pv2 span:nth-child(3n+2){text-align:inherit}.pv2 span:nth-child(2n){text-align:right}
.pv .h{color:var(--mute);font-size:12px}.pv .t{font-weight:800;border-top:1px solid var(--line);padding-top:6px}
details.pres{margin-top:16px;border:1.5px solid var(--line);border-radius:10px;padding:4px 14px 14px}
details.pres summary{cursor:pointer;font-weight:650;min-height:40px;display:flex;align-items:center}
.elige{display:grid;gap:10px;margin-top:10px}
.elige .btn{min-height:68px;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;font-size:17px;white-space:normal;text-align:left;padding:10px 18px}
.elige small{font-weight:500;font-size:13px;opacity:.75}
.foto{display:block;width:100%;max-height:70vh;object-fit:contain;border-radius:10px;margin-top:12px;background:var(--soft)}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.sug .chip{min-height:34px;font-size:13px;padding:0 12px}
.tagsf{align-items:center}.tagsf .lbl{flex:none;margin-right:2px}
fieldset.calf{border:1.5px solid var(--line);border-radius:10px;margin:16px 0 0;padding:4px 14px 12px}
fieldset.calf legend{font-weight:700;font-size:14px;padding:0 6px}
.calb{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin:10px 0 0;padding:12px 14px;background:var(--soft);border-radius:10px;font-size:15px}
.calb p{margin:2px 0 0}
.lblrow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.lblrow label{margin-bottom:6px}.lblrow .lnk{margin-bottom:2px}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-height:220px;overflow:auto}.pick .hint{width:100%;margin:0}
.segv{display:inline-grid;grid-auto-flow:column;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.segv button{border:0;background:var(--bg);min-height:42px;padding:0 18px;font-weight:650;font-size:15px;cursor:pointer}
.segv button span{color:var(--mute);font-weight:600;margin-left:4px}
.segv button.on{background:var(--ink);color:var(--bg)}.segv button.on span{color:inherit;opacity:.7}
.imp{margin:12px 0;max-height:52vh;overflow:auto;border-top:1px solid var(--line)}
.imp .chk{margin:0;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.imp .chk>span:first-of-type{flex:1;display:flex;flex-direction:column}
.imp small{color:var(--mute);font-weight:500;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + var(--sb));z-index:60;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:15px;max-width:min(92vw,460px);text-align:center}
.toast[hidden]{display:none}
@media(min-width:760px){.toast{bottom:100px}}
@media(prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{border-radius:12px}.btn .i{margin-left:-2px}
.av{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-stretch:112%;font-size:15px;letter-spacing:.02em;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.v{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--red)}
.av.lg{width:64px;height:64px;font-size:22px}
.row{grid-template-columns:auto minmax(0,1fr) auto;gap:2px 14px;align-items:center;padding:16px 0}
.row>.av{align-self:start;margin-top:2px}

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const okId=s=>typeof s==='string'&&/^[A-Za-z0-9_\-~:@+]{1,80}$/.test(s);
const r2=n=>Math.round((+n||0)*100)/100;
const hoy=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const sumarDias=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const dias=(a,b)=>Math.round((Date.parse(b+'T12:00:00')-Date.parse(a+'T12:00:00'))/864e5);
const num=v=>{if(typeof v==='number')return isFinite(v)?r2(v):0;let s=String(v||'').replace(/[^\d.,-]/g,'');if(s.includes(',')&&s.includes('.'))s=s.replace(/,/g,'');else if(s.includes(','))s=(/,\d{3}$/.test(s)&&!/,\d{1,2}$/.test(s))?s.replace(/,/g,''):s.replace(',','.');const n=parseFloat(s);return isFinite(n)?r2(n):0};
const NF={};
const fmtR=(n,c)=>{c=c||'PEN';try{NF[c]=NF[c]||new Intl.NumberFormat('es-PE',{style:'currency',currency:c,minimumFractionDigits:2,maximumFractionDigits:2});return NF[c].format(n||0)}catch(e){return c+' '+(n||0).toFixed(2)}};
const fmt=(n,c)=>S.oculto?fmtR(0,c).replace(/[\d.,\s\u00a0]+$/,'').trim()+' •••••':fmtR(n,c);
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fd=s=>{if(!s)return'';const p=s.split('-');return `${+p[2]} ${MES[+p[1]-1]} ${p[0]}`};
const rel=d=>{const n=dias(hoy(),d);return n===0?'hoy':n===1?'mañana':n===-1?'ayer':n>1?(n<=14?`en ${n} días`:'el '+fd(d)):`hace ${-n} días`};
const PROD={cotizado:'Cotización',produccion:'En producción',entregado:'Entregado',cancelado:'Cancelado'};
const METODOS=['Yape','Plin','Transferencia','Efectivo','Depósito','Tarjeta','Otro'];
const TIPOS=['Videoclip','Spot publicitario','Video corporativo','Contenido para redes','Boda','Evento','Documental','Cobertura en vivo','Fotografía','Edición / postproducción','Animación','Otro'];
const CATSG=['Equipo y accesorios','Software y suscripciones','Mantenimiento y reparaciones','Movilidad','Publicidad y redes','Internet y teléfono','Impuestos y trámites','Estudio / alquiler','Otros'];
const CATM={'Transporte':['Transporte','bus','#F3AF58'],'Hospedaje':['Hospedaje','bed','#62C5D8'],'Viáticos y alimentación':['Viáticos','fork','#E14060'],'Alquiler de equipo':['Equipo','cam','#5BA4F0'],'Personal / freelancers':['Personal','user','#7854F5'],'Locación':['Locación','pin','#5FAC9C'],'Licencias y música':['Licencias','music','#E8789A'],'Otros':['Otros','dots','#9F9F9F']};
const CATS=['Transporte','Hospedaje','Viáticos y alimentación','Alquiler de equipo','Personal / freelancers','Locación','Licencias y música','Otros'];
const MONEDAS={PEN:'Soles (S/)',USD:'Dólares (US$)',EUR:'Euros (€)'};
const OLD_TPL='Hola {cliente}, ¿cómo estás? Te escribo para recordarte el saldo pendiente de {saldo} por "{trabajo}". Quedo atento a tu confirmación. ¡Gracias!';
const TPL={
 tplAdelanto:'Hola {cliente}, ¿cómo estás? Para dejar confirmada la fecha de "{trabajo}" ({fecha}) quedaría pendiente el adelanto de {monto}. Me avisas cuando lo realices. ¡Gracias!',
 tplCuota:'Hola {cliente}, ¿cómo estás? Te recuerdo el pago de {cuota} por {monto} del proyecto "{trabajo}". Quedo atento. ¡Gracias!',
 tplCancel:'Hola {cliente}, ¿cómo estás? Te escribo por "{trabajo}": quedaría pendiente la cancelación de {monto}. Quedo atento a tu confirmación. ¡Gracias!'
};
const TERM_DEF='• Precios en la moneda indicada; no incluyen IGV salvo que se diga lo contrario.\n• Para separar la fecha se pide el adelanto indicado en la forma de pago.\n• El saldo se paga a la entrega del material final.\n• Incluye hasta 2 rondas de cambios en edición; cambios adicionales se cotizan aparte.\n• Cambios de fecha con al menos 72 horas de aviso; el adelanto no es reembolsable.';
const DEF_AJ={cotValidez:15,cotTerminos:TERM_DEF,cotContacto:'',negocio:'',moneda:'PEN',gracia:3,equipo:'',invFrec:'',tipoDef:'Videoclip',colRodaje:'4',colEntrega:'4',calId:'',calNom:'',...TPL};
const GCOL=[['1','Lavanda','#7986cb'],['2','Salvia','#33b679'],['3','Uva','#8e24aa'],['4','Flamenco','#e67c73'],['5','Plátano','#f6bf26'],['6','Mandarina','#f4511e'],['7','Pavo real','#039be5'],['8','Grafito','#616161'],['9','Arándano','#3f51b5'],['10','Albahaca','#0b8043'],['11','Tomate','#d50000']];
const colHex=id=>{const c=GCOL.find(x=>x[0]===String(id));return c?c[2]:''};
const colNom=id=>{const c=GCOL.find(x=>x[0]===String(id));return c?c[1]:(S.aj.calId?'Color del calendario '+(S.aj.calNom||''):'Predeterminado')};
const colT=t=>t.color||S.aj.colRodaje||'';
const ROSA='#d81b60';
const colApp=id=>!id?ROSA:colHex(id);
const swatches=(name,sel,conDef,defTxt)=>`<div class="sws">${conDef?`<label title="${esc(defTxt)}"><input type="radio" name="${name}" value=""${!sel?' checked':''}><span class="swd"><i style="background:${ROSA}"></i>${name==='color'?'Auto':'Del calendario'}</span></label>`:''}${GCOL.map(([v,n,hx])=>`<label title="${n}"><input type="radio" name="${name}" value="${v}"${sel===v?' checked':''} aria-label="${n}"><span style="background:${hx}"></span></label>`).join('')}</div>`;
const ETQ_BASE=['Urgente','Cliente frecuente','Requiere factura','Viaje','Drone'];
const S={oculto:false,gastosGen:[],clientes:[],artistas:[],vc:'clientes',qa:'',noPicker:false,trabajos:[],aj:{...DEF_AJ},modo:'cargando',aviso:'',f:'cobrar',q:'',qc:'',anio:null,mon:null,tag:'',tv:'lista',mes:'',dia:''};
function normAj(d){const a={...DEF_AJ,...(d||{})};if(d&&d.plantilla&&!d.tplCancel&&d.plantilla!==OLD_TPL)a.tplCancel=d.plantilla;const g=parseInt(a.gracia,10);a.gracia=isFinite(g)?Math.max(0,Math.min(60,g)):3;return a}
const normT=d=>({modoPago:'adelanto',adelantoReq:0,cuotas:[],presupuesto:{},pagos:[],gastos:[],etiquetas:[],invitados:[],...d,entrega:d.entrega!==undefined?d.entrega:(d.vence||'')});

/* ---------- cálculos ---------- */
const cli=id=>S.clientes.find(c=>c.id===id);
const art=id=>id?S.artistas.find(a=>a.id===id):null;
const nrm=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase().replace(/\s+/g,' ');
const porNombre=(arr,n)=>arr.find(x=>nrm(x.nombre)===nrm(n));
const nomArt=t=>{const a=art(t.artistaId);return a?a.nombre:''};
const quien=t=>{const a=nomArt(t),c=cli(t.clienteId);if(a&&c&&nrm(a)!==nrm(c.nombre))return a+' · '+c.nombre;return a||(c?c.nombre:'Sin cliente')};
const temasTxt=t=>{const n=parseInt(t.temas,10)||0;return n>0?n+(n===1?' tema':' temas'):''};
const nomCli=t=>{const c=cli(t.clienteId);return c?c.nombre:'Sin cliente'};
const pagado=t=>r2((t.pagos||[]).reduce((a,p)=>a+num(p.monto),0));
const gastosT=t=>r2((t.gastos||[]).reduce((a,g)=>a+num(g.monto),0));
const reembT=t=>r2((t.gastos||[]).filter(g=>g.reemb).reduce((a,g)=>a+num(g.monto),0));
const propiosT=t=>r2(gastosT(t)-reembT(t));
const retT=t=>t.retencion?r2(num(t.total)*0.08):0;
const cobrarT=t=>r2(num(t.total)+reembT(t)-retT(t));
const saldo=t=>Math.max(0,r2(cobrarT(t)-pagado(t)));
const eqAcordado=t=>r2(((t.equipo)||[]).reduce((a,e)=>a+num(e.acordado),0));
const eqPagadoP=e=>r2((e.pagos||[]).reduce((a,p)=>a+num(p.monto),0));
const eqFalta=e=>Math.max(0,r2(num(e.acordado)-eqPagadoP(e)));
const gananciaT=t=>r2(num(t.total)-propiosT(t)-eqAcordado(t));
const cuenta=t=>!['cotizado','cancelado'].includes(t.estadoProd);
const baseEntrega=t=>t.entregadoEl||t.entrega||'';
const G=()=>S.aj.gracia??3;
function cuotas(t){
 const tot=num(t.total),cob=cobrarT(t);let L=[];
 if(t.modoPago==='plan'&&Array.isArray(t.cuotas)&&t.cuotas.length){
  L=t.cuotas.filter(c=>num(c.monto)>0).map(c=>({id:c.id,concepto:c.concepto||'Cuota',monto:num(c.monto),vence:c.fecha||'',tipo:/adelanto|separ/i.test(c.concepto||'')?'adelanto':'cuota'}));
 }else{const a=Math.min(num(t.adelantoReq),tot);if(a>0)L=[{id:'adelanto',concepto:'Adelanto del trabajo',monto:a,vence:t.fecha||'',tipo:'adelanto'}]}
 const usado=L.reduce((s,c)=>s+c.monto,0);
 const fin=Math.max(0,r2(cob-usado));
 if(fin>0||!L.length)L.push({id:'final',concepto:L.length?'Cancelación al entregar':'Pago al entregar',monto:fin,vence:baseEntrega(t),tipo:'entrega'});
 let pg=pagado(t);
 for(const c of L){const ap=Math.min(pg,c.monto);c.pagado=r2(ap);c.falta=r2(c.monto-ap);pg=r2(pg-ap)}
 return L;
}
const vencidas=t=>{const h=hoy();return cuotas(t).filter(c=>c.falta>0.004&&c.vence&&sumarDias(c.vence,G())<h)};
const montoVencido=t=>r2(vencidas(t).reduce((a,c)=>a+c.falta,0));
const proxima=t=>cuotas(t).find(c=>c.falta>0.004);
function estado(t){
 if(t.estadoProd==='cotizado')return'cotizado';
 if(t.estadoProd==='cancelado')return'cancelado';
 if(cobrarT(t)<=0)return'sinmonto';
 const nx=proxima(t);if(!nx)return'pagado';
 if(vencidas(t).length)return'vencido';
 if(nx.tipo==='adelanto')return'adelanto';
 if(nx.tipo==='entrega'&&(t.estadoProd==='entregado'||(nx.vence&&nx.vence<=hoy())))return'porcobrar';
 return'separado';
}
const activos=()=>S.trabajos.filter(t=>cuenta(t)&&saldo(t)>0.004);
function etiqueta(t){
 const e=estado(t),nx=proxima(t);
 if(e==='vencido'){const v=vencidas(t)[0];const d=dias(v.vence,hoy());return `Vencido · ${d} ${d===1?'día':'días'}`}

function parseVcf(txt){
 const un=String(txt||'').replace(/\r\n?/g,'\n').replace(/\n[ \t]/g,'');const out=[];
 for(const card of un.split(/BEGIN:VCARD/i).slice(1)){
  const body=card.split(/END:VCARD/i)[0],o={nombre:'',telefono:'',email:'',empresa:''},tels=[];let nn='';
  for(const line of body.split('\n')){const i=line.indexOf(':');if(i<0)continue;const key=line.slice(0,i).replace(/^item\d+\./i,''),name=key.split(';')[0].toUpperCase();
   const val=line.slice(i+1).replace(/\\n/gi,' ').replace(/\\([,;\\])/g,'$1').trim();
   if(name==='FN')o.nombre=val;else if(name==='N'){const p=val.split(';');nn=[p[1],p[2],p[0]].filter(Boolean).join(' ').trim()}
   else if(name==='TEL')tels.push({v:val.replace(/^tel:/i,''),cel:/CELL|MOBILE|IPHONE/i.test(key)});
   else if(name==='EMAIL'&&!o.email)o.email=val;else if(name==='ORG'&&!o.empresa)o.empresa=val.split(';')[0].trim()}
  o.nombre=(o.nombre||nn||o.empresa).slice(0,120);const tl=tels.find(x=>x.cel)||tels[0];if(tl)o.telefono=tl.v.slice(0,40);
  if(o.nombre)out.push(o);
 }
 return out;
}

async function restaurar(txt){
 let d;try{d=JSON.parse(txt)}catch(e){toast('Ese texto no es una copia de seguridad válida.');return}
 const cs=(Array.isArray(d.clientes)?d.clientes:[]).filter(x=>x&&typeof x==='object'),ts=(Array.isArray(d.trabajos)?d.trabajos:[]).filter(x=>x&&typeof x==='object');
 if(!cs.length&&!ts.length){toast('La copia no tiene datos.');return}
 cerrar();toast(`Restaurando ${cs.length+ts.length} registros…`);
 for(const c of cs){if(!okId(c.id))c.id=uid();await guardar('clientes',c).catch(()=>{});if(db)await espera(160)}
 for(const g of (Array.isArray(d.gastosGen)?d.gastosGen:[]).filter(x=>x&&typeof x==='object')){if(!okId(g.id))g.id=uid();await guardar('gastosGen',g).catch(()=>{});if(db)await espera(160)}
 for(const a of (Array.isArray(d.artistas)?d.artistas:[]).filter(x=>x&&typeof x==='object')){if(!okId(a.id))a.id=uid();await guardar('artistas',a).catch(()=>{});if(db)await espera(160)}
 for(const t of ts){if(!okId(t.id))t.id=uid();await guardar('trabajos',normT(t)).catch(()=>{});if(db)await espera(160)}
 if(d.aj&&typeof d.aj==='object'){S.aj=normAj(d.aj);await guardarAj()}
 toast('Copia restaurada.');
}

// La app arma el plan de los próximos 45 días; Supabase manda cada mañana (8 a.m.) los del día.
// Sin montos ni nombres de clientes: solo el trabajo y el artista.
function planAvisos(){
 const A=S.aj.avisos||{};if(!A.on)return[];
 const h=hoy(),lim=sumarDias(h,45),out=[],add=(fecha,id,titulo,cuerpo,url)=>{if(fecha&&fecha>=h&&fecha<=lim)out.push({id,fecha,titulo,cuerpo,url})};
 for(const t of S.trabajos){
  if(t.estadoProd==='cancelado')continue;
  const nom='«'+(t.titulo||'Trabajo')+'»'+(nomArt(t)?' · '+nomArt(t):''),url='#t-'+t.id;
  const cs=cuenta(t)?cuotas(t):[],faltaAd=cs.some(c=>c.tipo==='adelanto'&&c.falta>0.004);
  if(A.cobros!==false)for(const c of cs){if(c.falta<=0.004||!c.vence)continue;
   if(c.tipo!=='entrega')add(c.vence,'v-'+t.id+'-'+c.id,c.tipo==='adelanto'?'Hoy toca cobrar el adelanto':'Hoy vence: '+c.concepto,nom,url);
   add(sumarDias(c.vence,G()+1),'x-'+t.id+'-'+c.id,'Pago vencido: '+c.concepto,nom,url)}
  if(A.entregas!==false&&t.estadoProd==='produccion'&&t.entrega)add(sumarDias(t.entrega,-1),'e-'+t.id,'Mañana entregas',nom+(saldo(t)>0.004?' · cobrar al entregar':''),url);
  if(A.rodajes!==false&&t.estadoProd!=='cotizado')for(const b of bloques(t))add(sumarDias(b.fecha,-1),'r-'+t.id+'-'+b.fecha,'Mañana rodaje'+(b.horaIni?' · '+b.horaIni:''),nom+(t.lugar?' · '+t.lugar:'')+(faltaAd?' · falta el adelanto':''),url);
 }
 return out.sort((a,b)=>a.fecha.localeCompare(b.fecha)||a.id.localeCompare(b.id));
}

// Busca en trabajos, clientes, artistas, pagos y gastos. Cada palabra debe aparecer (sin tildes ni mayúsculas).
function buscarTodo(q){
 const w=nrm(q).split(' ').filter(Boolean);if(!w.length)return null;
 const ok=(...xs)=>{const n=nrm(xs.filter(x=>x!=null&&x!=='').join(' '));return w.every(x=>n.includes(x))};
 const mto=v=>{const n=num(v);return n?[String(n),fmtR(n,'PEN').replace(/[^\d.,]/g,''),Math.round(n)].join(' '):''};
 const R={t:[],c:[],a:[],p:[],g:[]};
 for(const t of S.trabajos){
  const est=PROD[t.estadoProd]||'';
  if(ok(t.titulo,quien(t),nomCli(t),t.tipo,t.lugar,t.notas,(t.etiquetas||[]).join(' '),t.temasNom,est,fd(t.fecha),mto(t.total)))R.t.push(t);
  for(const p of t.pagos||[])if(ok(mto(p.monto),p.metodo,p.nota,fd(p.fecha),t.titulo,quien(t),'pago cobro'))R.p.push({t,p});
  for(const g of t.gastos||[])if(ok(mto(g.monto),g.cat,g.det,fd(g.fecha),t.titulo,quien(t),'gasto'))R.g.push({t,g});
 }
 for(const c of S.clientes)if(ok(c.nombre,c.telefono,c.email,c.notas,c.doc,'cliente'))R.c.push(c);
 for(const a of S.artistas)if(ok(a.nombre,a.telefono,a.email,a.notas,'artista'))R.a.push(a);
 for(const g of S.gastosGen||[])if(ok(mto(g.monto),g.cat,g.det,fd(g.fecha),'gasto general'))R.g.push({g});
 const rec=(x,y)=>(y||'').localeCompare(x||'');
 R.t.sort((x,y)=>rec(x.fecha,y.fecha));R.p.sort((x,y)=>rec(x.p.fecha,y.p.fecha));R.g.sort((x,y)=>rec(x.g.fecha,y.g.fecha));
 return R;
}
function resultadosBusqueda(q){
 const R=buscarTodo(q);
 if(!R)return `<p class="hint">Escribe el nombre de un trabajo, cliente o artista, un monto (por ejemplo 1500), un método de pago o una palabra de las notas.</p>`;
 const tot=R.t.length+R.c.length+R.a.length+R.p.length+R.g.length;
 if(!tot)return `<p class="hint">No encontré nada con “${esc(q)}”. Prueba con menos palabras.</p>`;
 const MAX=8,grupo=(tit,arr,fila)=>arr.length?`<div class="bq"><h3>${tit}<span>${arr.length}</span></h3>${arr.slice(0,MAX).map(fila).join('')}${arr.length>MAX?`<p class="hint">y ${arr.length-MAX} más: escribe otra palabra para afinar.</p>`:''}</div>`:'';
 const fila=(a,id,p,tit,sub,der)=>`<button type="button" class="it bqi" data-a="${a}" data-id="${esc(id)}"${p?` data-p="${esc(p)}"`:''}><div><b>${esc(tit)}</b><p>${sub}</p></div>${der?`<span class="bqm">${der}</span>`:''}</button>`;
 return grupo('Trabajos',R.t,t=>fila('verT',t.id,'',t.titulo||'Trabajo',esc([quien(t),PROD[t.estadoProd],fd(t.fecha)].filter(Boolean).join(' · ')),fmt(num(t.total),t.moneda)))
  +grupo('Clientes',R.c,c=>fila('verC',c.id,'',c.nombre,esc([c.telefono,c.email].filter(Boolean).join(' · ')||'Cliente'),''))
  +grupo('Artistas',R.a,a=>fila('verA',a.id,'',a.nombre,esc([a.telefono,a.email].filter(Boolean).join(' · ')||'Artista'),''))
  +grupo('Pagos',R.p,({t,p})=>fila('editarPago',t.id,p.id,t.titulo||'Trabajo',esc([fd(p.fecha),p.metodo,p.nota].filter(Boolean).join(' · ')),fmt(num(p.monto),t.moneda)))
  +grupo('Gastos',R.g,({t,g})=>t?fila('editarG',t.id,g.id,g.det||g.cat||'Gasto',esc([t.titulo,g.cat,fd(g.fecha)].filter(Boolean).join(' · ')),fmt(num(g.monto),t.moneda))
   :fila('editarGen',g.id,'',g.det||g.cat||'Gasto general',esc(['Gasto general',g.cat,fd(g.fecha)].filter(Boolean).join(' · ')),fmt(num(g.monto),g.moneda||S.aj.moneda||'PEN')));
}
